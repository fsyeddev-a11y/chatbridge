<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBridge Chess App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div id="message-banner" class="message-banner" role="status" aria-live="polite"></div>

      <div class="board-shell">
        <div id="board" class="board" aria-label="Interactive chess board"></div>
      </div>

      <div class="game-bar">
        <p id="turn-indicator" class="turn-indicator white">White to move</p>
        <div class="game-bar-actions">
          <button id="new-game-btn" type="button">New Game</button>
          <button id="resign-btn" type="button" class="secondary">Resign</button>
        </div>
      </div>

      <!-- Hidden elements still referenced by main.js -->
      <div class="hidden">
        <p id="bridge-status"></p>
        <p id="game-status"></p>
        <p id="side-to-move"></p>
        <p id="phase-text"></p>
        <p id="last-move"></p>
        <p id="board-caption"></p>
        <select id="opponent-select">
          <option value="easy" selected>Easy AI</option>
        </select>
        <p id="opponent-status"></p>
        <p id="position-summary"></p>
        <p id="captured-white"></p>
        <p id="captured-black"></p>
        <ol id="move-history"></ol>
        <button id="end-session-btn" type="button"></button>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
