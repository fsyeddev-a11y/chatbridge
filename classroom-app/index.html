<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Classroom</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div id="message-banner" class="banner"></div>

      <div class="status-card">
        <div id="status-icon" class="status-icon">🔒</div>
        <h2 id="status-text" class="status-title">Not Connected</h2>
        <p id="status-detail" class="status-detail"></p>
      </div>

      <div id="loading" class="loading hidden">Loading classroom data...</div>
      <div id="course-list" class="course-list"></div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
